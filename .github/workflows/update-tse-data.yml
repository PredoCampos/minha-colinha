name: Atualizar dados do TSE

on:
  schedule:
    - cron: "23 8 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-tse-2026
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate code
        run: npm run check

      - name: Generate validated TSE snapshot
        run: npm run data:tse

      - name: Open or update snapshot pull request
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_BRANCH: automation/tse-2026-snapshot
        shell: bash
        run: |
          git add public/data/2026
          if git diff --cached --quiet; then
            echo "No snapshot changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$UPDATE_BRANCH"
          git commit -m "chore(data): atualiza snapshot TSE 2026"
          git push --force origin "$UPDATE_BRANCH"

          existing_pr="$(gh pr list --head "$UPDATE_BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -z "$existing_pr" ]; then
            gh pr create \
              --base main \
              --head "$UPDATE_BRANCH" \
              --title "chore(data): atualiza snapshot TSE 2026" \
              --body "Atualização automática diária dos dados oficiais do TSE. O pipeline validou integralmente CSVs, mapeamentos, fotos e snapshots antes de publicar esta branch."
          fi
