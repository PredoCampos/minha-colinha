name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 8 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate pipeline source
        run: npm run typecheck

      - name: Generate and validate official TSE snapshot
        run: npm run data:tse

      - name: Check application and build production bundle
        run: npm run check

      - name: Verify generated data in production bundle
        shell: bash
        run: |
          test -s public/data/2026/metadata.json
          test "$(find public/data/2026 -name candidates.json -type f | wc -l)" -eq 109
          test -s dist/data/2026/metadata.json
          test "$(find dist/data/2026 -name candidates.json -type f | wc -l)" -eq 109
          test "$(find dist/data/2026 -name '*.jpg' -type f | wc -l)" -gt 0

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
